# Rule data. Inspired by the INCOSE Guide to Writing Requirements (GtWR v4); wording is our own.
# phrases: matched case-insensitively on the raw text (use for fixed phrases and abbreviations).
# lemmas:  single words matched on the token or its lemma (catches German inflection: ausreichende -> ausreichend).
# severity: error | warning | info

# Grade caps: an item gets the worst cap among its active findings, then one letter lower
# per distinct warning/error rule beyond the first (floor F). No findings → "none".
[grading]
caps = { error = "D", warning = "B", info = "A" }
pileup_step = 1

[categories]
accuracy = "Accuracy"
completeness = "Completeness"
non_ambiguity = "Non-ambiguity"
realism = "Realism"

[rules.vague-term]
category = "accuracy"
incose = "R7, R34"
severity = "warning"
message = "Vague or unmeasurable term; ask for a measurable value"
en.lemmas = ["fast", "quick", "quickly", "slow", "slowly", "sufficient", "sufficiently", "adequate", "adequately", "appropriate", "appropriately", "suitable", "reasonable", "robust", "reliable", "user-friendly", "easy", "easily", "simple", "flexible", "efficient", "efficiently", "optimal", "significant", "significantly", "timely", "approximately", "several", "many", "few", "various", "seamless", "seamlessly", "intuitive"]
en.phrases = ["as soon as possible", "state of the art", "state-of-the-art", "user friendly", "high performance"]
# "vieler"/"einiger" are spaCy's lemmas of vielen/einigen; "wenigen" is listed as is because its lemma "weniger" is also the bound in "weniger als"
de.lemmas = ["schnell", "zügig", "langsam", "ausreichend", "hinreichend", "angemessen", "geeignet", "adäquat", "robust", "zuverlässig", "benutzerfreundlich", "einfach", "flexibel", "effizient", "optimal", "schnellstmöglich", "zeitnah", "ungefähr", "etwa", "circa", "einige", "einiger", "mehrere", "viele", "vieler", "wenige", "wenigen", "verschieden", "entsprechend", "üblich", "intuitiv", "nahtlos", "performant"]
de.phrases = ["ca.", "Stand der Technik", "so schnell wie möglich"]

[rules.missing-tolerance]
category = "accuracy"
incose = "R6, R33"
severity = "warning"
message = "Value with unit but no tolerance or bound (min/max, ±, range)"

[rules.escape-clause]
category = "completeness"
incose = "R8"
severity = "error"
message = "Escape clause makes the requirement non-binding"
en.phrases = ["where possible", "if possible", "as far as possible", "to the extent possible", "as much as possible", "if necessary", "if needed", "when needed", "as needed", "when necessary", "as necessary", "as closely as possible", "as far as practicable", "as well as possible", "as much as practical", "as appropriate", "as required", "if applicable", "where applicable", "if feasible", "where feasible", "if practical", "where practical"]
de.phrases = ["wenn möglich", "falls möglich", "soweit möglich", "sofern möglich", "nach Möglichkeit", "möglichst", "ggf.", "gegebenenfalls", "falls erforderlich", "falls notwendig", "wenn nötig", "wenn notwendig", "so weit wie möglich", "so gut wie möglich", "weitestgehend", "weitgehend", "sofern erforderlich", "soweit erforderlich", "sofern sinnvoll", "soweit sinnvoll", "im Rahmen der Möglichkeiten", "nach Bedarf"]

[rules.open-ended]
category = "completeness"
incose = "R9"
severity = "warning"
message = "Open-ended list; enumerate the complete set"
en.phrases = ["etc.", "etc", "and so on", "and so forth", "including but not limited to", "but not limited to", "such as", "e.g.", "among others", "and similar", "or similar"]
de.phrases = ["usw.", "etc.", "u.a.", "u. a.", "unter anderem", "z.B.", "z. B.", "zum Beispiel", "beispielsweise", "wie etwa", "und ähnliches", "u.ä.", "u. ä.", "o.ä.", "o. ä.", "oder ähnliches", "und Weiteres", "insbesondere"]

[rules.undefined-condition]
category = "completeness"
incose = "R27"
severity = "info"
message = "Condition that is rarely defined; check it is specified (glossary or definition)"
en.phrases = ["in case of failure", "in case of error", "in case of a failure", "in case of an error", "under normal conditions", "in normal operation", "during normal operation", "when required", "if required", "in an emergency", "in emergency situations"]
de.phrases = ["im Fehlerfall", "bei Fehlern", "bei Bedarf", "im Bedarfsfall", "im Normalbetrieb", "unter normalen Bedingungen", "in der Regel", "im Notfall", "bei Störungen", "im Störfall"]

[rules.ambiguous-combinator]
category = "non_ambiguity"
incose = "R17, R19"
severity = "warning"
message = "Ambiguous combinator; split the requirement or state the logic explicitly"
en.phrases = ["and/or", "and / or"]
de.phrases = ["und/oder", "und / oder", "bzw.", "beziehungsweise"]

[rules.unresolved-reference]
category = "non_ambiguity"
incose = "R24"
severity = "warning"
message = "Pronoun or back-reference; name the entity explicitly"
en.pronouns = ["it", "they", "them", "this", "these", "those", "that"]
en.phrases = ["the above", "above-mentioned", "above mentioned", "aforementioned", "the former", "the latter", "see above"]
de.pronouns = ["es", "sie", "dies", "diese", "dieser", "dieses", "diesem", "diesen", "derselbe", "dieselbe", "dasselbe"]
de.phrases = ["oben genannt", "oben genannte", "oben genannten", "obige", "obigen", "o.g.", "o. g.", "vorgenannt", "vorgenannte", "vorgenannten", "siehe oben"]

[rules.passive-no-actor]
category = "non_ambiguity"
incose = "R2"
severity = "info"
message = "Passive voice without actor; who is responsible?"

[rules.absolute]
category = "realism"
incose = "R26"
severity = "warning"
message = "Absolute statement; usually unachievable or unverifiable"
en.lemmas = ["always", "never"]
en.phrases = ["at all times", "under all circumstances", "under any circumstances", "in all cases", "without exception"]
de.lemmas = ["immer", "nie", "niemals", "jederzeit", "stets", "ausnahmslos"]
de.phrases = ["unter allen Umständen", "in jedem Fall", "zu jeder Zeit", "ohne Ausnahme"]


[rules.temporal-word]
category = "accuracy"
incose = "R35"
severity = "warning"
message = "Vague timing; give an explicit time bound (e.g. within 100 ms)"
en.lemmas = ["immediately", "promptly", "instantly", "soon", "eventually"]
en.phrases = ["in time", "without delay", "right away"]
de.lemmas = ["sofort", "unverzüglich", "umgehend", "rechtzeitig", "alsbald", "sogleich"]
de.phrases = ["ohne Verzögerung"]

[rules.purpose-phrase]
category = "non_ambiguity"
incose = "R20"
severity = "info"
message = "Purpose phrase; move the reason to the rationale"
en.phrases = ["in order to", "so that", "so as to", "for the purpose of", "with the aim of"]
# "um … zu" and the conjunction "damit" are found by the parser (checks._purpose_de); "damit" is also an adverb
de.phrases = ["sodass", "so dass", "zum Zweck", "mit dem Ziel"]

[rules.superfluous-infinitive]
category = "accuracy"
incose = "R10"
severity = "warning"
message = "Superfluous infinitive; state the capability directly (shall store, not shall be able to store)"
en.phrases = ["be able to", "be capable of", "have the capability to", "have the ability to"]
de.phrases = ["in der Lage", "imstande", "im Stande", "die Möglichkeit haben", "die Möglichkeit bieten"]

[rules.clause-combinator]
category = "non_ambiguity"
incose = "R19"
severity = "warning"
message = "Clause combinator; split into separate requirements or state the exception as its own condition"
en.phrases = ["unless", "except", "however", "otherwise", "whereas"]
de.phrases = ["es sei denn", "außer wenn", "außer falls", "sondern", "andernfalls", "ansonsten"]


# Modal verbs: EN by the parser's MD tag and lemma; DE by surface form, because de_core_news_sm
# tags "muss" as VVFIN or NE. German future "wird/werden + infinitive" is found by the parser.
[rules.single-thought]
category = "non_ambiguity"
incose = "R18"
severity = "warning"
message = "More than one obligation in one requirement; split it"
en.obligation = ["shall", "must", "should", "will"]
de.obligation = ["muss", "müssen", "soll", "sollen", "sollte", "sollten", "darf", "dürfen", "kann", "können"]

[rules.weak-obligation]
category = "completeness"
incose = "ISO 29148"
severity = "warning"
message = "Weak or unclear obligation; is this binding (shall / muss)?"
en.weak = ["should", "will", "may"]
de.weak = ["sollte", "sollten", "kann", "können", "könnte", "könnten"]

[rules.soll-obligation]
category = "completeness"
incose = "ISO 29148"
severity = "info"
message = "\"soll\" can mean desired, not mandatory; use \"muss\" if binding"
de.weak = ["soll", "sollen"]


[rules.oblique]
category = "non_ambiguity"
incose = "R17"
severity = "warning"
message = "Slash between words can mean and, or, or per; write it out"

[rules.parenthetical]
category = "non_ambiguity"
incose = "R21"
severity = "info"
message = "Text in parentheses; make it part of the requirement or move it to a note"


# Whole-spec rules: each finding goes on every affected item and lists the others as `related`.
[rules.undefined-acronym]
category = "completeness"
incose = "R37, R38, R4"
severity = "info"
message = "Acronym never expanded in this spec; define it (\"Electronic Control Unit (ECU)\") or add a glossary"

[rules.decimal-format]
category = "accuracy"
incose = "R40"
severity = "info"
message = "Decimal separator differs from the rest of the spec (1,5 vs 1.5)"

[rules.unit-system]
category = "accuracy"
incose = "R6, R36"
severity = "warning"
message = "Unit system differs from the rest of the spec (metric vs imperial)"

[rules.duplicate]
category = "completeness"
incose = "R30"
severity = "warning"
message = "Near-identical to another requirement; keep one"

# All-caps words that need no expansion: common bus/hardware acronyms and capitalized keywords.
# The units in [tolerance] and the item IDs of the run are never acronyms either.
[acronyms]
known = ["CAN", "LIN", "USB", "LED", "PC", "OK", "ON", "OFF", "EIN", "AUS", "KEIN", "KEINE", "NUR", "SHALL", "MUST", "SHOULD", "WILL", "MAY", "NOT", "AND", "OR", "IF", "THEN", "MUSS", "SOLL", "DARF", "KANN", "NICHT", "UND", "ODER", "WENN", "DANN"]


# EARS conformance, only with --ears (speclint/ears.py). German keywords are speclint's own choice:
# there is no standard German EARS keyword set.
[rules.ears-nonconforming]
category = "non_ambiguity"
incose = "R1"
severity = "warning"
message = "Not an EARS pattern"

[ears.en]
keywords = { while = "state", when = "event", if = "unwanted", where = "optional" }
modals = ["shall"]
then = "then"
main = "the <system> shall <response>"

[ears.de]
keywords = { solange = "state", wenn = "event", falls = "unwanted", sofern = "optional" }
modals = ["muss", "müssen"]
then = "dann"
main = "das <System> muss <Reaktion>"

# Units for missing-tolerance (case-sensitive) and the words that make a value bounded.
[tolerance]
metric = ["m", "mm", "cm", "km", "µm", "km/h", "m/s", "kg", "g", "t", "°C", "bar", "mbar", "Pa", "kPa", "N", "Nm"]
imperial = ["°F", "inch", "ft", "lb", "lbs", "mph", "psi", "gal"]  # not "in": an ordinary English word
rates = ["km/h", "m/s", "m/s²", "kbit/s", "Mbit/s", "U/min"]  # a slash that is a unit, not an oblique
units = ["ms", "µs", "us", "ns", "s", "sec", "min", "h", "Hz", "kHz", "MHz", "GHz", "V", "mV", "kV", "A", "mA", "µA", "W", "mW", "kW", "Wh", "kWh", "Ah", "mAh", "°C", "K", "m", "mm", "cm", "km", "µm", "km/h", "m/s", "m/s²", "kg", "g", "t", "N", "Nm", "bar", "mbar", "Pa", "kPa", "%", "dB", "dBm", "lx", "cd", "rpm", "U/min", "bit", "Bit", "byte", "Byte", "kB", "MB", "GB", "kbit/s", "Mbit/s", "fps", "Ω", "kΩ"]
en.bounds = ["max", "maximum", "min", "minimum", "at least", "at most", "within", "less than", "more than", "greater than", "lower than", "higher than", "up to", "no more than", "no less than", "not exceed", "not more than", "not less than", "between", "below", "above", "under", "over", "exceed", "exceeds", "≤", "≥", "<", ">", "±", "+/-", "+-"]
de.bounds = ["max", "max.", "maximal", "höchstens", "min", "min.", "mindestens", "minimal", "innerhalb", "weniger als", "mehr als", "kleiner", "größer", "unter", "über", "bis", "zwischen", "nicht überschreiten", "nicht unterschreiten", "≤", "≥", "<", ">", "±", "+/-", "+-"]

# Profiles: which rules run, at which severity (= grade cap). `--profile <name|file.toml>`; a custom file
# uses a [profile] table with the same keys. Resolution: extends, then rules (replace), enable, disable, severity.
[profiles.customer]
rules = ["vague-term", "missing-tolerance", "escape-clause", "open-ended", "undefined-condition", "ambiguous-combinator", "unresolved-reference", "passive-no-actor", "absolute", "temporal-word", "weak-obligation", "undefined-acronym", "duplicate"]

[profiles.system]
extends = "customer"
enable = ["purpose-phrase", "superfluous-infinitive", "clause-combinator", "single-thought", "soll-obligation", "oblique", "parenthetical", "decimal-format", "unit-system"]
severity = { passive-no-actor = "warning" }
